# What a PR has to prove before it can reach the board.
#
# The board is deployed by two routes that meet only in production: code goes
# out when main merges and Vercel rebuilds, state is published to Cloudflare KV
# from the laptop every few minutes. Nothing used to check that the two agreed,
# and twice that cost a day. Once when three commits of UI work sat in the repo
# because deploy/renderer was never re-synced, so the deployment kept serving an
# older interface. Once when the renderer read a favicon out of deploy/public/,
# which exists on every laptop and is not in the serverless bundle, so it
# rendered locally, passed every test, and 502'd on every deployed request.
#
# Both are the same shape: the working tree is not the thing that ships. These
# checks run against what ships.
#
# The suite is run by `unittest discover`, with no exclusion list. It used to
# name two modules to skip, test_resume_pdf and test_resume_build, on the
# grounds that they need the user's own documents and a local Chrome. Measured
# 2026-08-29: of the 36 tests in those two modules, 34 passed on a clean
# machine, 1 skipped itself, and exactly 1 failed -- and that one failed
# because its guard checked for the tracked template while its assertion needed
# the untracked profile. Guarding the assertion is a two-line fix; the
# exclusion list cost CI every future test written in either file. See
# tests/test_ci_covers_everything.py, which fails if a filter comes back.

name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      # A real Postgres, so the migration runner is tested against the thing it
      # will run against rather than a mock. It is a throwaway container, not
      # Neon: CI needs no secret to run these, every branch gets its own, and
      # nothing a test does can reach the database holding real applications.
      #
      # Not pooled, which matters. packages/schema/migrate.py refuses a pooled
      # URL because pg_advisory_lock is session-scoped and a pooler hands each
      # transaction whatever backend is free -- the lock would appear to work
      # and would exclude nobody.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobby
          POSTGRES_PASSWORD: jobby
          POSTGRES_DB: jobby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOBBY_TEST_DATABASE_URL: postgresql://jobby:jobby@localhost:5432/jobby_test
      # Read by tests/test_ci_covers_everything.py: in CI a database test that
      # skips for want of a database is a hole, not a skip. GitHub sets this
      # already; naming it here is what makes the rule legible.
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version Vercel builds the function with. Matching it here is the
          # point: 3.13 on a laptop will happily run code the deployment cannot.
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Python dependencies
        run: python3 -m pip install --quiet 'psycopg[binary]==3.3.4'

      - name: The deployed renderer matches scripts/
        run: |
          # Scoped to the two directories sync_vercel_renderer.py generates.
          # The rest of deploy/ — api/, the .mjs helpers, vercel.json — is
          # hand-written, and failing a PR for editing those would teach
          # everyone to ignore this check. --porcelain rather than a diff so a
          # newly added asset shows up as untracked instead of silently passing.
          python3 scripts/sync_vercel_renderer.py
          stale="$(git status --porcelain -- deploy/renderer deploy/assets)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::The deployed renderer bundle is stale. Run 'python3 scripts/sync_vercel_renderer.py' and commit deploy/renderer and deploy/assets, or Vercel keeps building the old one."
            exit 1
          fi

      - name: Python tests
        # The same command CLAUDE.md's Verification section tells a person to
        # run. One command in both places means CI and the laptop cannot drift
        # into testing different sets, which a hand-maintained module list did.
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Parity tooling runs against a real database
        # Not the parity job itself: CI has no file store to compare against,
        # and a green run here would say nothing about the two stores agreeing.
        # What CI does check is that the tooling works against a real Postgres
        # and that its exit code cannot lie, which is the half that rots.
        run: |
          python3 -m unittest tests.test_verify_parity tests.test_dual_write \
                              tests.test_write_paths -v 2>&1 | tail -5
          # A parity run with no database must exit non-zero. If it ever exits
          # 0, the scheduled job would report green while checking nothing,
          # and the seven-day clock would be measuring silence.
          if python3 scripts/verify_parity.py --root /nonexistent >/dev/null 2>&1; then
            echo "::error::verify_parity exited 0 with no store to compare"
            exit 1
          fi

      - name: The v2 stylesheet matches the board
        # Same shape as the renderer check above and the same reason: the
        # requirement is that v2 looks one for one identical to the board it
        # replaces, and nothing but a regenerate-and-diff can hold that.
        run: |
          python3 scripts/sync_v2_styles.py
          # apps/web/public/ is in this list because every file in it is
          # reachable only by URL: site.webmanifest names three PNGs and the
          # head links a fourth, so a stale or missing one is a 404 that no
          # render and no HTML assertion can see.
          stale="$(git status --porcelain -- apps/web/app/board.css \
                     apps/web/app/chrome.generated.ts \
                     apps/web/app/lanes.generated.ts \
                     apps/web/app/rubric.generated.ts \
                     apps/web/app/logos.generated.ts \
                     apps/web/app/lane_chrome.generated.ts \
                     apps/web/app/icons.generated.ts \
                     apps/web/public)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::v2's generated files are stale. Run 'python3 scripts/sync_v2_styles.py' and commit the result."
            exit 1
          fi

      - name: Node tests
        # One glob again: apps/web/test/ held the hand-written design-system
        # tests, and the stylesheet is generated from dashboard.py now, so
        # those assertions moved to tests/test_v2_styles_are_current.py.
        # An unmatched glob under `bash -e` passes the literal string to node,
        # so a dead glob is a failure waiting for the first clean checkout.
        # tests/test_ci_covers_everything.py asserts every *.test.mjs on disk
        # is reached by a glob here, so adding a directory fails until this
        # line learns about it.
        run: node --test tests/*.test.mjs

      - name: The /v2 board builds and deploys the shape it was tested in
        # The Next.js half of the renderer-sync check above, and it exists for
        # the same two reasons. `npm ci` rather than `npm install`, so the tree
        # CI tests is the tree the lockfile pins and a drifted lockfile fails
        # here rather than at deploy time. Then the deployed-shape check builds,
        # strips the source tree away, and serves the traced bundle: an asset
        # URL that forgets the basePath or a file the server reads that the
        # tracer never carried fails the PR instead of the board.
        run: |
          # The board reads Postgres, so the traced server needs a schema and
          # an account or every route 500s with a named reason -- correct
          # behaviour, and not what this check is about. Applied here rather
          # than before the test suite, because a migrated `public` shared by
          # every test makes them see each other's rows: measured, 13 tests
          # that pass alone and fail in a suite.
          python3 packages/schema/migrate.py apply
          python3 -c "
          import sys; sys.path.insert(0, 'packages/schema')
          import migrate
          conn = migrate.connect(announce=False)
          with conn.cursor() as cur:
              cur.execute(\"insert into accounts (email) values ('ci@example.com') on conflict do nothing\")
          conn.commit()"
          cd apps/web
          npm ci
          node tools/check_deployed_shape.mjs

      - name: The migrations can rebuild the schema
        # **`migrate.py status` answers an adjacent question and reads as
        # coverage.** It compares the migrations *table* against the migrations
        # *directory*, so it says whether every file has been applied and is
        # silent about whether applying them produces what is actually there.
        # Production had 25 drifts across 23 tables against the 17 the
        # migrations build, and status was green throughout.
        #
        # Here this catches a migration that will not apply cleanly, and any
        # table a test creates outside the migration system. It runs after the
        # Python tests for that second reason.
        #
        # **It does not catch production's drift**, because CI has a container
        # built from these same migrations. Run it against production before a
        # deploy; that is the reading that matters and it is not automatable
        # from here.
        run: python3 scripts/schema_drift.py --url "$JOBBY_TEST_DATABASE_URL"

      - name: Syntax
        run: |
          python3 -m py_compile scripts/*.py deploy/api/page.py \
            packages/schema/*.py
          bash -n deploy/oci/setup.sh
