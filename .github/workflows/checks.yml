# What a PR has to prove before it can reach the board.
#
# The board is deployed by two routes that meet only in production: code goes
# out when main merges and Vercel rebuilds, state is published to Cloudflare KV
# from the laptop every few minutes. Nothing used to check that the two agreed,
# and twice that cost a day. Once when three commits of UI work sat in the repo
# because deploy/renderer was never re-synced, so the deployment kept serving an
# older interface. Once when the renderer read a favicon out of deploy/public/,
# which exists on every laptop and is not in the serverless bundle, so it
# rendered locally, passed every test, and 502'd on every deployed request.
#
# Both are the same shape: the working tree is not the thing that ships. These
# checks run against what ships.
#
# The suite is run by `unittest discover`, with no exclusion list. It used to
# name two modules to skip, test_resume_pdf and test_resume_build, on the
# grounds that they need the user's own documents and a local Chrome. Measured
# 2026-08-29: of the 36 tests in those two modules, 34 passed on a clean
# machine, 1 skipped itself, and exactly 1 failed -- and that one failed
# because its guard checked for the tracked template while its assertion needed
# the untracked profile. Guarding the assertion is a two-line fix; the
# exclusion list cost CI every future test written in either file. See
# tests/test_ci_covers_everything.py, which fails if a filter comes back.

name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      # A real Postgres, so the migration runner is tested against the thing it
      # will run against rather than a mock. It is a throwaway container, not
      # Neon: CI needs no secret to run these, every branch gets its own, and
      # nothing a test does can reach the database holding real applications.
      #
      # Not pooled, which matters. packages/schema/migrate.py refuses a pooled
      # URL because pg_advisory_lock is session-scoped and a pooler hands each
      # transaction whatever backend is free -- the lock would appear to work
      # and would exclude nobody.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jobby
          POSTGRES_PASSWORD: jobby
          POSTGRES_DB: jobby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobby"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOBBY_TEST_DATABASE_URL: postgresql://jobby:jobby@localhost:5432/jobby_test
      # Read by tests/test_ci_covers_everything.py: in CI a database test that
      # skips for want of a database is a hole, not a skip. GitHub sets this
      # already; naming it here is what makes the rule legible.
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version Vercel builds the function with. Matching it here is the
          # point: 3.13 on a laptop will happily run code the deployment cannot.
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Python dependencies
        run: python3 -m pip install --quiet 'psycopg[binary]==3.3.4'

      - name: The deployed renderer matches scripts/
        run: |
          # Scoped to the two directories sync_vercel_renderer.py generates.
          # The rest of deploy/ — api/, the .mjs helpers, vercel.json — is
          # hand-written, and failing a PR for editing those would teach
          # everyone to ignore this check. --porcelain rather than a diff so a
          # newly added asset shows up as untracked instead of silently passing.
          python3 scripts/sync_vercel_renderer.py
          stale="$(git status --porcelain -- deploy/renderer deploy/assets)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::The deployed renderer bundle is stale. Run 'python3 scripts/sync_vercel_renderer.py' and commit deploy/renderer and deploy/assets, or Vercel keeps building the old one."
            exit 1
          fi

      - name: Python tests
        # The same command CLAUDE.md's Verification section tells a person to
        # run. One command in both places means CI and the laptop cannot drift
        # into testing different sets, which a hand-maintained module list did.
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Node tests
        run: node --test tests/*.test.mjs

      - name: Syntax
        run: |
          python3 -m py_compile scripts/*.py deploy/api/page.py \
            packages/schema/*.py
          bash -n deploy/oci/setup.sh
