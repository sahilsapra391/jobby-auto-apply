# The sourcing worker. A scheduled machine, not a server: it has no ports, no
# health check and no http service, because nothing calls it. Fly starts it,
# it fetches, it writes to Postgres, it exits.
app = "jobby-sourcing"

# **iad, because the write is what matters.** Neon is on
# ep-weathered-rice-ayyav4uq-pooler.c-5.us-east-2.aws.neon.tech -- AWS Ohio --
# and this container's job ends in a multi-thousand-row insert there. The
# connectors are HTTP-bound against two dozen third parties whose latency this
# cannot influence anyway: the measured sweep was 19.2 seconds for 3,441
# postings over four requests, and almost all of that was waiting on Greenhouse.
# iad (Ashburn) is Fly's conventional pairing with AWS us-east; ord (Chicago)
# is the alternate and is no closer to Ohio in practice.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# No [[services]] and no [http_service] on purpose. A machine with a service
# block is one Fly keeps alive and load-balances to; this one should be stopped
# except when it is sweeping, which is about 3 hours a day.
#
# **And leaving them out does not stop `fly deploy` creating machines.** `--ha`
# defaults to true -- "Create spare machines that increases app availability" --
# so the first deploy against this file made a worker *and* a standby, both of
# which would have swept in parallel. HA is a deploy-time flag rather than a
# consequence of the service block, so the answer is not to configure `deploy`
# differently but not to use it: the workflow builds with `--build-only --push`
# and updates the one machine that exists. Nothing in CI creates one.
# **2 GB, and the lever is memory rather than vCPU.** Read from inside the
# container 97 minutes into a cold greenhouse sweep on 2026-09-08:
#
#     MemTotal 459 MB   MemFree 23 MB   MemAvailable 85 MB   loadavg 1.36
#
# `sweep_worker.sweep` holds a whole channel's postings before staging, and
# greenhouse cold is ~24,000 postings carrying full descriptions. At 512 MB the
# kernel reclaims pages continuously and every parse pays for it: 17.5 s per
# board where the laptop, cold, does the same boards at 1.57 s. The sweep is
# single-threaded, so a second vCPU would sit idle; the constraint was never
# CPU. 2 GB is the most a shared-cpu-1x carries, and it is four times the
# measured ceiling rather than a guess at it.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

[env]
  JOB_APPLICATION_DIR = "/var/lib/jobby"
